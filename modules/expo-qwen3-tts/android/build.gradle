apply plugin: 'com.android.library'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useDefaultAndroidSdkVersions()
useCoreDependencies()

android {
    namespace 'expo.modules.qwen3tts'

    defaultConfig {
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }

        // Real devices are arm64. Debug builds additionally ship x86_64 so the
        // emulator can load the native engine (an emulator-only build used to
        // be patched by hand and reverted, silently breaking every TTS call
        // with "Native library not loaded"). Release stays arm64-only.
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        debug {
            ndk {
                abiFilters "arm64-v8a", "x86_64"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }

    // No jniLibs.srcDirs here on purpose. CMake builds ggml and the engine
    // straight into libqwen3tts_jni.so, so there is nothing to stage. Pointing
    // jniLibs at CMake build directories is what made mergeReleaseJniLibFolders
    // fail on duplicate cmake_install.cmake files.

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
