name: Build Android APK & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release?'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build cmake

      - name: Build Native C++ Dependencies (GGML + qwen3-tts-cpp + omnivoice-cpp)
        run: |
          echo "NDK_HOME from action: ${{ steps.setup-ndk.outputs.ANDROID_NDK_HOME }}"
          export ANDROID_NDK_HOME="${{ steps.setup-ndk.outputs.ANDROID_NDK_HOME }}"
          chmod +x ./scripts/build-native-deps.sh
          ./scripts/build-native-deps.sh
        shell: bash

      - name: Generate Native Android Project
        run: npx expo prebuild --platform android --clean

      - name: Build Release APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK with version
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found!"
            exit 1
          fi
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+ ]]; then
            TAG_NAME="v1.0.0-$(date +'%Y%m%d-%H%M%S')"
          fi
          NEW_PATH="VoxClone-Pro-${TAG_NAME}.apk"
          cp "$APK_PATH" "$NEW_PATH"
          echo "apk_path=$NEW_PATH" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Built: $NEW_PATH ($(du -h "$NEW_PATH" | cut -f1))"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voxclone-apk
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release & Attach APK
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.create_release == true || inputs.create_release == 'true'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag_name }}
          files: ${{ steps.apk.outputs.apk_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
