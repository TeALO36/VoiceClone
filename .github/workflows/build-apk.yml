name: Build Android APK & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release?'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Install the exact NDK and CMake that app.config.ts pins. Letting a
      # third-party action pick a different revision (r27c = 27.2.x) meant
      # Gradle silently fetched a second toolchain at build time.
      - name: Install Android NDK 27.1.12297006 + CMake 3.22.1
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Generate Native Android Project
        run: npx expo prebuild --platform android --clean

      # The Pocket TTS engine needs libsherpa-onnx-c-api.so + libonnxruntime.so
      # inside the APK. They are gitignored (26 MB of binaries fetched by
      # scripts/fetch-sherpa-onnx-android.sh), so every CI build must fetch
      # them explicitly — a release APK built without them fails at runtime
      # with "Bibliothèque Pocket TTS introuvable".
      - name: Fetch sherpa-onnx native libraries
        run: bash scripts/fetch-sherpa-onnx-android.sh

      - name: Verify native libraries are staged
        run: |
          LIBDIR="modules/expo-qwen3-tts/android/src/main/jniLibs/arm64-v8a"
          test -f "$LIBDIR/libsherpa-onnx-c-api.so" || { echo "Missing libsherpa-onnx-c-api.so"; exit 1; }
          test -f "$LIBDIR/libonnxruntime.so" || { echo "Missing libonnxruntime.so"; exit 1; }
          ls -la "$LIBDIR"

      - name: Build Release APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK with version
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found!"
            exit 1
          fi
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+ ]]; then
            TAG_NAME="v1.0.0-$(date +'%Y%m%d-%H%M%S')"
          fi
          NEW_PATH="VoxClone-Pro-${TAG_NAME}.apk"
          cp "$APK_PATH" "$NEW_PATH"
          echo "apk_path=$NEW_PATH" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Built: $NEW_PATH ($(du -h "$NEW_PATH" | cut -f1))"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voxclone-apk
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release & Attach APK
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.create_release == true || inputs.create_release == 'true'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag_name }}
          files: ${{ steps.apk.outputs.apk_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
